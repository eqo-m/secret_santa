name: Deploy reveal pages to GitHub Pages

# Rebuilds site/ from the current data/people.json + data/history.json and
# publishes it as a Pages deployment artifact — never commits the generated
# (reveal-token-bearing) HTML to git. Safe to run on every push: build-site.ts
# has no side effects (no new draw, no email).
#
# One-time setup: in the repo's Settings > Pages, set Source to
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
